name: Update tsuru client reference

on:
  schedule:
  - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1

    - uses: actions/setup-go@v6.5.0
      with:
        go-version: stable

    - name: Regenerate pages
      run: make generate-tsuru-client-docs

    - name: Open pull request on drift
      uses: peter-evans/create-pull-request@v7.0.11
      with:
        branch: bot/update-cli-docs
        title: "Update tsuru client reference from tsuru-client main"
        commit-message: "Regenerate tsuru client docs from tsuru-client main"
        body: Auto-generated by `make generate-tsuru-client-docs` from the tsuru-client main branch.
