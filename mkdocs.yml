site_name: Tsuru Docs
site_url: https://tsuru.github.com/docs
site_author: Tsuru

repo_url: https://github.com/tsuru/docs.git
repo_name: tsuru/docs

theme:
  name: material
  favicon: ./static/favicon.ico
  logo: ./static/logo.svg

  palette:
    primary: black

  features:
  - content.code.copy
  - content.code.select
  - navigation.instant
  - navigation.tracking
  - navigation.tabs
  - toc.follow

plugins:
- search
- swagger-ui-tag

markdown_extensions:
- admonition
- attr_list
- footnotes
- pymdownx.details
- pymdownx.emoji:
    emoji_index: !!python/name:material.extensions.emoji.twemoji
    emoji_generator: !!python/name:material.extensions.emoji.to_svg
- pymdownx.highlight
- pymdownx.snippets:
    base_path:
    - src/
- pymdownx.superfences
- pymdownx.tabbed:
    alternate_style: true
- toc:
    permalink: true

docs_dir: src

nav:
- Getting started:
  - Overview: ./getting_started/overview.md
  - Architecture: ./getting_started/architecture.md
  - "Install on minikube": ./getting_started/install_minikube.md
  - "Install on GKE": ./getting_started/install_gke.md
